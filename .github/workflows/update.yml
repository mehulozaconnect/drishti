name: Update news

# GitHub often delays or skips scheduled runs, so each run keeps itself alive for about 5.5 hours,
# refreshes the news every 15 minutes, then starts the next run itself. The hourly schedule is only a backup.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/**']

permissions:
  contents: write
  pages: write
  actions: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev || npm install --omit=dev
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: drishti-cache5-${{ github.run_id }}
          restore-keys: drishti-cache5-
      - name: Fetch news every 30 minutes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "drishti-bot"
          git config user.email "drishti-bot@users.noreply.github.com"
          for i in $(seq 1 21); do
            start=$(date +%s)
            git pull -q --rebase || true
            npm install --omit=dev --silent || true
            node scripts/fetch.mjs || echo "fetch failed, will retry next round"
            git add data
            if ! git diff --cached --quiet; then
              git commit -q -m "News update $(date -u +%H:%M) UTC"
              for t in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
              gh api -X POST repos/${{ github.repository }}/pages/builds >/dev/null 2>&1 || true
            fi
            if [ "$i" -lt 21 ]; then left=$(( 900 - ( $(date +%s) - start ) )); [ "$left" -lt 60 ] && left=60; sleep "$left"; fi
          done
          true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: drishti-cache5-${{ github.run_id }}
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml -R ${{ github.repository }} || true
