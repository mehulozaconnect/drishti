name: Update news

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev || npm install --omit=dev
      - uses: actions/cache/restore@v4
        with:
          path: .cache
          key: drishti-cache5-${{ github.run_id }}
          restore-keys: drishti-cache5-
      - name: Fetch news and markets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/fetch.mjs
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache
          key: drishti-cache5-${{ github.run_id }}
      - name: Save data
        run: |
          git config user.name "drishti-bot"
          git config user.email "drishti-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "News update $(date -u +%H:%M) UTC" -q
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: Refresh the live site
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds >/dev/null 2>&1 || echo "Pages not enabled yet"
