<!doctype html>
<html lang="en" data-theme="paper" data-mode="light" data-accent="saffron">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drishti — your morning, briefed</title>
<meta name="description" content="Personal news from trusted sources, Quick 60 summaries, markets, gold, investing tools and an AI assistant.">
<meta name="theme-color" content="#F4EFE4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">

<script>try{var s=JSON.parse(localStorage.getItem('drishti.settings')||'{}'),d=document.documentElement,t=(s.v||0)<4?'paper':(s.theme||'paper');d.dataset.theme=t;d.dataset.mode=(t==='dark'||t==='midnight')?'dark':'light';d.dataset.accent=s.accent||'saffron'}catch(e){}</script>
</head>
<body>
<div class="app"><main id="view"></main></div>
