<!doctype html>
<html lang="en" data-theme="light" data-mode="light" data-accent="saffron">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drishti — your morning, briefed</title>
<meta name="description" content="Personal news from trusted sources, Quick 60 summaries, markets, gold, investing tools and an AI assistant.">
<meta name="theme-color" content="#0D0E12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=14">
<script>try{var s=JSON.parse(localStorage.getItem('drishti.settings')||'{}'),d=document.documentElement,t=s.theme||'light';d.dataset.theme=t;d.dataset.mode=(t==='dark'||t==='midnight')?'dark':'light';d.dataset.accent=s.accent||'saffron'}catch(e){}</script>
</head>
<body>
<div class="app"><main id="view"></main></div>
<div id="navwrap"></div>
<script type="module" src="js/app.js?v=14"></script>
</body>
</html>
